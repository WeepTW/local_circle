name: local_circle
services:
  db:
    build: ./DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: local_circle
      MYSQL_USER: local_circle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    ports:
      - '127.0.0.1:${DB_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DB/001_ddl.sql:/docker-entrypoint-initdb.d/001_ddl.sql:ro
      - ./DB/002_stored_procedures.sql:/docker-entrypoint-initdb.d/002_stored_procedures.sql:ro
      - ./DB/003_seed_demo.sql:/docker-entrypoint-initdb.d/003_seed_demo.sql:ro
      - ./DB/005_grants.sql:/docker-entrypoint-initdb.d/005_grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -e "CALL local_circle.sp_product_list_active()" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      APP_PORT: 8089
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:${WEB_PORT:-8088},http://127.0.0.1:${WEB_PORT:-8088}
      DB_URL: jdbc:mysql://db:3306/local_circle?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    depends_on:
      # Internal DB host stays constant for isolated Compose test projects too.
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -H "X-Demo-User-Id: 1" http://127.0.0.1:8089/api/v1/products >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
