spring.application.name=local_circle
server.address=127.0.0.1
server.port=${APP_PORT:8089}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:${DB_PORT:3307}/local_circle?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:local_circle}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=8KB
logging.level.org.springframework.web=ERROR
local-circle.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.transaction.default-timeout=15
spring.mvc.async.request-timeout=15000
